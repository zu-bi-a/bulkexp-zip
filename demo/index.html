<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bulkexp-zip demo</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #2563eb; --bad: #dc2626; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524; --accent: #60a5fa; --bad: #f87171; --card: #1c1917; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; height: 10px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 12px; overflow: auto; max-height: 280px; white-space: pre-wrap; margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; font-variant-numeric: tabular-nums; }
  .stats div { font-size: 13px; color: var(--muted); } .stats b { display: block; color: var(--fg); font-size: 17px; }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>bulkexp-zip demo</h1>
  <p class="lead">Test files are generated by this page's Service Worker (deterministic bytes, no network cost), then streamed into one zip.</p>

  <section>
    <div class="grid">
      <label>Files <input id="count" type="number" value="400" min="1"></label>
      <label>Total size (MB) <input id="total" type="number" value="1024" min="1"></label>
      <label>Latency per file (ms) <input id="latency" type="number" value="50" min="0"></label>
      <label>Failure rate (0–1) <input id="failrate" type="number" value="0" min="0" max="1" step="0.01"></label>
      <label>Concurrency <input id="concurrency" type="number" value="4" min="1"></label>
      <label>Tier
        <select id="tier"><option value="">auto</option><option>fsa</option><option>sw</option><option>opfs</option><option>blob</option></select>
      </label>
      <label>On file error
        <select id="onerr"><option>fail</option><option>skip</option></select>
      </label>
    </div>
    <div class="row">
      <button id="planBtn">Plan</button>
      <button id="exportBtn" class="primary" disabled>Export zip</button>
      <button id="cancelBtn" disabled>Cancel</button>
      <button id="cleanupBtn">Clean up OPFS</button>
    </div>
  </section>

  <section>
    <progress id="bar" value="0" max="1"></progress>
    <div class="stats">
      <div>Tier<b id="sTier">–</b></div>
      <div>Written<b id="sBytes">–</b></div>
      <div>Files<b id="sFiles">–</b></div>
      <div>Speed<b id="sSpeed">–</b></div>
      <div>JS heap<b id="sHeap">–</b></div>
    </div>
    <div id="resumable"></div>
  </section>

  <section><pre id="log"></pre></section>
</main>

<script type="module">
import { plan, exportZip, resume, listResumable, discard, cleanup, UseServerError } from './bulkexp-zip/index.js'

const $ = (id) => document.getElementById(id)
const fmt = (b) => b >= 1 << 30 ? (b / (1 << 30)).toFixed(2) + ' GB' : (b / (1 << 20)).toFixed(1) + ' MB'
const log = (...a) => { $('log').textContent = a.join(' ') + '\n' + $('log').textContent }
const SW = { url: './sw.js' }
let job

// The page must be controlled by the SW so test-data fetches are intercepted.
const reg = await navigator.serviceWorker?.register('./sw.js').catch((e) => log('SW registration failed:', e.message))
if (navigator.serviceWorker && !navigator.serviceWorker.controller) {
  await new Promise((r) => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }))
}
$('exportBtn').disabled = !navigator.serviceWorker?.controller
if (!navigator.serviceWorker) log('No Service Worker here (private mode?): the test-data generator cannot run.')

function files() {
  const n = +$('count').value, total = +$('total').value * 1024 * 1024
  const each = Math.floor(total / n)
  const q = `?latency=${+$('latency').value}&failrate=${+$('failrate').value}`
  return Array.from({ length: n }, (_, i) => ({
    url: `./testdata/${i + 1}/${each}/f${i}.bin${q}`,
    name: `photos/IMG_${String(i).padStart(5, '0')}.jpg`,
    size: each,
  }))
}
const opts = () => ({ serviceWorker: SW, ...($('tier').value ? { tiers: [$('tier').value] } : {}) })

$('planBtn').onclick = async () => log('plan():', JSON.stringify(await plan(files(), opts())))

function track(j, t0 = performance.now()) {
  job = j
  $('cancelBtn').disabled = false
  return {
    onProgress(p) {
      $('bar').value = p.total ? p.bytes / p.total : 0
      $('sTier').textContent = p.tier
      $('sBytes').textContent = fmt(p.bytes) + (p.total ? ' / ' + fmt(p.total) : '')
      $('sFiles').textContent = `${p.filesDone} / ${p.filesTotal}` + (p.errors ? ` (${p.errors} err)` : '')
      $('sSpeed').textContent = (p.bytes / (1 << 20) / ((performance.now() - t0) / 1000)).toFixed(0) + ' MB/s'
      if (performance.memory) $('sHeap').textContent = fmt(performance.memory.usedJSHeapSize)
    },
  }
}

async function finish(j) {
  try {
    const r = await j.done
    log(`Done: ${r.tier}, ${fmt(r.bytes)}, ${r.files} files, ${r.errors.length} errors`)
  } catch (e) {
    if (e instanceof UseServerError) log('Use the server path:', e.plan.reason)
    else log('Failed:', e.name, e.message)
  } finally {
    $('cancelBtn').disabled = true
    showResumable()
  }
}

$('exportBtn').onclick = () => {
  const p = track(null)
  const j = exportZip(files(), {
    ...opts(),
    name: 'bulkexp-demo.zip',
    concurrency: +$('concurrency').value,
    onFileError: $('onerr').value,
    checkpointBytes: 256 << 20,
    onProgress: p.onProgress,
  })
  job = j
  log('Started', j.id)
  finish(j)
}
$('cancelBtn').onclick = () => job?.cancel()
$('cleanupBtn').onclick = async () => log('Removed', await cleanup({ force: true }), 'OPFS file(s)')

async function showResumable() {
  const box = $('resumable')
  box.replaceChildren()
  for (const r of await listResumable()) {
    const row = document.createElement('div')
    row.className = 'row'
    row.append(`Interrupted: ${r.name}, ${fmt(r.bytesWritten)}, ${r.filesDone}/${r.filesTotal} files `)
    const go = Object.assign(document.createElement('button'), { textContent: 'Resume', className: 'primary' })
    go.onclick = () => { const p = track(null); const j = resume(r.id, { onProgress: p.onProgress }); job = j; finish(j) }
    const drop = Object.assign(document.createElement('button'), { textContent: 'Discard' })
    drop.onclick = async () => { await discard(r.id); showResumable() }
    row.append(go, drop)
    box.append(row)
  }
}
showResumable()
window.bulkexp = { plan, exportZip, resume, listResumable, cleanup }
</script>
</body>
</html>
